# Which units count as "viable": the main page, the complex pages' default view and the weekly
# email digest show only these. Everything is still scraped and kept; the "All units" page
# shows it all.

# Bedroom counts (0 = studio).
beds: [1, 2]

# Monthly cost must be strictly under this: net of specials, with the required monthly fees
# included where the site lists them. Sites that list no fees use rent after specials,
# marked "fees not listed".
max_monthly: 1900

# Shortest lease you'd sign. Where a site prices several terms (SightMap, Entrata), each unit
# uses its cheapest term of at least this many months (ties go to the shorter lease). Units the
# site quotes only for a shorter term stay listed, flagged.
min_lease_months: 11
