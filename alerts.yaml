# Settings for the weekly email digest (alerts.py). Which units it reports on is set in
# viable.yaml, shared with the site. SMTP settings are NOT here: they live outside the repo
# in ~/.config/apartments/alerts.env (see alerts.env.example).

site_url: https://mattrudy13.github.io/apartments/

# Starred floorplans/units to report on (viable or not): paste the "Copy share link" from the
# shortlist card on the main page. Re-paste it after starring more; the digest can't read your
# browser's shortlist.
# shortlist: https://mattrudy13.github.io/apartments/?shortlist=...
